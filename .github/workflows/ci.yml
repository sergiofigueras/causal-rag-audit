name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install .
      - name: Compile source
        run: python -m compileall -q src tests examples
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate example dataset
        run: python -m causal_rag_audit validate examples/audit_cases.json
      - name: Run strict demo gate
        run: python -m causal_rag_audit run --dataset examples/audit_cases.json --target examples.demo_rag:grounded_rag --output "${{ runner.temp }}/causal-audit" --minimum strict_causal_evidence_score=1.0

  ci:
    name: CI
    if: always()
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Require all test jobs
        env:
          RESULT: ${{ needs.tests.result }}
        run: test "$RESULT" = success
